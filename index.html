<title>受保护的页面 · Protected</title>
<style>
:root{--bg:#EFEEE9;--panel:#F8F7F3;--ink:#22231F;--muted:#6A695F;--line:#D8D5CA;--accent:#9C7244;--err:#B03A2E;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#191A17;--panel:#21221E;--ink:#ECEAE3;--muted:#A4A296;--line:#393A34;--accent:#CFA06C;--err:#E07A6C;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{font:600 20px/1.3 "Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;margin:0}
p{margin:0;color:var(--muted);font-size:13.5px}
input[type=password]{font:16px/1.4 inherit;font-family:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
button{font:600 15px inherit;font-family:inherit;padding:10px;border:0;border-radius:6px;background:var(--ink);color:var(--bg);cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
.err{color:var(--err);font-size:13.5px;min-height:1.2em}
</style>
</head>

</form>

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function show(html) { document.open(); document.write(html); document.close(); }
  function openWith(rawKey) {
    return crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt'])
      .then(function (k) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.iv) }, k, b64(P.ct)); })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function saved() { try { return sessionStorage.getItem('jb-key') || localStorage.getItem('jb-key'); } catch (e) { return null; } }
  var form = document.getElementById('gate'), err = document.getElementById('err'), go = document.getElementById('go');
  var s = saved();
  if (s) {
    form.style.visibility = 'hidden';
    window.addEventListener('load', function () {
      openWith(b64(s)).then(show).catch(function () {
        try { sessionStorage.removeItem('jb-key'); localStorage.removeItem('jb-key'); } catch (e) {}
        form.style.visibility = '';
      });
    });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = '正在解锁… / Unlocking…';
    var pw = new TextEncoder().encode(document.getElementById('pw').value);
    crypto.subtle.importKey('raw', pw, 'PBKDF2', false, ['deriveBits'])
      .then(function (base) { return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter }, base, 256); })
      .then(function (bits) {
        var raw = new Uint8Array(bits);
        return openWith(raw).then(function (html) {
          var k = btoa(String.fromCharCode.apply(null, raw));
          try { (document.getElementById('remember').checked ? localStorage : sessionStorage).setItem('jb-key', k); } catch (e2) {}
          show(html);
        });
      })
      .catch(function () { err.textContent = '密码不正确。 / Wrong password.'; go.disabled = false; go.textContent = '进入 / Unlock'; });
  });
